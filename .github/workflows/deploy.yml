name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - name: Build
        run: |
          echo "[deploy] mkdocs build 시작"
          mkdocs build --strict
          echo "[deploy] build 완료: $(find site -name '*.html' | wc -l)개 페이지"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "[deploy] 배포 완료 → ${{ steps.deployment.outputs.page_url }}"
